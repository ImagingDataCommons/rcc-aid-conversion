[project]
name = "rcc-aid-conversion"
version = "0.1.0"
description = "Convert RCC-AID NIfTI kidney/tumor/cyst annotations to DICOM LABELMAP Segmentation"
requires-python = ">=3.10"
dependencies = [
    # Pinned: labelmap semantics changed within the 1.5.x line. See docs/decisions.md ADR-009.
    "dcmqi==1.5.7",
    "SimpleITK>=2.3",
    "pydicom>=2.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "duckdb>=1.0",
    "idc-index>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcc_aid"]
