  notes:
  - "Conversion pipeline, decision log and QC reports: https://github.com/fedorov/rcc-aid-conversion"
  - "129 label maps converted, one DICOM LABELMAP SEG per annotated scan. All 129 source CT series
    are present in IDC (16055 instances, 8.27 GB) and were verified against the record's manifest.tcia."
  - "SEGMENTATION TYPE: this is LABELMAP, which as of IDC v24 has no precedent in the archive
    (seg_index holds 172908 BINARY and 17238 FRACTIONAL series, zero LABELMAP). A BINARY variant was
    generated in parallel and verified to decode identically, as an interoperability fallback should
    LABELMAP support prove insufficient downstream."
  - "UPSTREAM DEFECT, needs reporting to the RCC-AID authors: 13 of the 129 published NIfTI label maps
    (all TCGA-KIRC, all from multi-acquisition series) store their slices in descending DICOM z order
    while declaring a +z direction cosine, so their declared geometry places the annotation outside the
    imaged range. The same 13 files are float32 with label values such as 1.0000152587890625 rather
    than exact integers. Both were corrected before conversion; the correction was validated by image
    intensity (fraction of kidney-labelled voxels in soft tissue: 0.995 median for the chosen
    orientation vs 0.790 for the reverse, chosen better in 129/129 cases). See docs/decisions.md
    ADR-011 in the conversion repository."
  - "CATEGORY CODE: the Kidney segment uses (91723000, SCT, 'Anatomical Structure') per DICOM PS3.16
    CID 7150. Note that dcmqi's bundled code list uses 123037004, which does not occur anywhere in
    Part 16, so existing dcmqi-generated content in IDC likely differs on this attribute. Segmented
    property TYPE codes are unchanged, so queries by segmented structure remain compatible."
  - "OPEN: zenodo.creators below lists only the conversion author and needs confirmation before any
    deposit is created."
  - "DATASET DOI: every object carries 10.5281/zenodo.22284133 in
    OtherClinicalTrialProtocolIDsSequence (0012,0023) issued by 'DOI', per IDC convention, together
    with the Clinical Trial Subject module it belongs to -- sponsor TCGA, the source collection's
    TCGA protocol, and the tissue source site IDC already publishes for each patient. Adding the
    sequence alone would make the objects a Standard Extended SOP Class under dciodvfy. If the
    reserved DOI changes before publication, re-run scripts/patch_clinical_trial.py and reload the
    review store."
