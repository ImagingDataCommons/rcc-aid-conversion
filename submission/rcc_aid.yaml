summary: |-
  This dataset contributes DICOM-converted voxel-level annotations of the kidney and of renal masses
  and cysts to the TCGA-KIRC, TCGA-KIRP and TCGA-KICH collections in the NCI Imaging Data Commons.
  The annotations cover 129 CT scans from 91 patients, spanning clear cell (85 scans), papillary (26)
  and chromophobe (18) renal cell carcinoma.

  The annotations were released by the RCC-AID project in the NIfTI format, which leaves them
  disconnected from the DICOM images they describe: they cannot be loaded in DICOM viewers, they carry
  no standard terminology identifying what was segmented, and they cannot be queried alongside the
  imaging. Converting them to DICOM Segmentation ties each annotation back to the exact source image
  instances, describes the segmented structures with standard SNOMED-CT terminology, and makes them
  usable in off-the-shelf tools such as the OHIF Viewer.

  Please see the [RCC-AID](https://doi.org/10.5281/zenodo.20719257) record to learn more about the
  annotations and about attribution and citation requirements.
description: |-
  This dataset contributes DICOM-converted voxel-level annotations of the kidney and of renal masses
  and cysts to the TCGA-KIRC, TCGA-KIRP and TCGA-KICH collections available from the NCI Imaging Data
  Commons (IDC) [1]. The annotations were produced by the RCC-AID project [2,3] and originally
  released in the NIfTI format at [https://doi.org/10.5281/zenodo.20719257](https://doi.org/10.5281/zenodo.20719257).
  They cover 129 CT scans from 91 patients: 85 clear cell, 26 papillary and 18 chromophobe renal cell
  carcinoma cases, drawn from three TCGA collections originally released through The Cancer Imaging
  Archive (TCIA) [4,5,6].

  Converting these annotations from NIfTI to DICOM allows users to visualize the CT images and the
  corresponding kidney, mass and cyst annotations together in public DICOM-based viewers. The DICOM
  Segmentation format carries additional metadata describing each segmented structure using standard
  SNOMED-CT terminology, and references the specific source image instances that each annotation
  applies to. The converted objects can be stored in any DICOM server that supports them (including
  Google Healthcare DICOM stores) and visualized with off-the-shelf tools such as the OHIF Viewer.

  Each annotated scan is represented by a single DICOM Segmentation object using the LABELMAP
  segmentation type, containing up to three segments:

  | Segment | Segmented property category | Segmented property type | Anatomic region |
  |---|---|---|---|
  | Kidney | Anatomical Structure (SCT 91723000) | Kidney (SCT 64033007) | -- |
  | Mass | Morphologically Abnormal Structure (SCT 49755003) | Mass (SCT 4147007) | Kidney (SCT 64033007) |
  | Cyst | Morphologically Abnormal Structure (SCT 49755003) | Cyst (SCT 367643001) | Kidney (SCT 64033007) |

  All 129 objects contain the Kidney and Mass segments; 38 additionally contain a Cyst segment. The
  segments are coded following DICOM PS3.16, using the coded terminology published at
  [https://fedorov.github.io/dcmterms/](https://fedorov.github.io/dcmterms/). "Mass" was chosen over a
  histology-specific concept because it reflects what was delineated on the CT images, and because it
  matches the coding already used by the kidney segmentations in the C4KC-KiTS and BAMF-AIMI-Annotations
  analysis results in IDC. The renal cell carcinoma subtype is recorded at the dataset level rather
  than inside the segmentation objects.

  The segments are marked as SEMIAUTOMATIC with the algorithm name "Robust Kidney Abnormality
  Segmentation": as described in the RCC-AID publication [2], a public segmentation model was used to
  delineate the kidneys and an abstract "renal abnormality" class, after which two annotators quality
  checked and corrected the result and assigned the abnormality masks to tumors and cysts, with
  uncertain cases reviewed by a board-certified radiologist.

  Conversion from NIfTI to DICOM SEG modality was performed using the dcmqi toolkit
  ([https://github.com/QIICR/dcmqi](https://github.com/QIICR/dcmqi)) [7]. Each converted object
  references the exact set of source DICOM instances that produced the annotated volume; this matters
  because several of the source CT series bundle multiple contrast phases into a single DICOM series,
  and the annotations apply to one acquisition within such a series. Details of the conversion process,
  including the terminology decisions and per-case quality control, are provided in this GitHub
  repository: [https://github.com/fedorov/rcc-aid-conversion](https://github.com/fedorov/rcc-aid-conversion).
